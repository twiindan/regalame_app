<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">

        <div class="flex flex-col md:flex-row gap-3">
            <label class="sr-only" for="catalog-q">Buscar productos</label>
            <input id="catalog-q" type="search" name="q" value="" placeholder="Buscar productos..."

            <label class="sr-only" for="catalog-sort">Ordenar por</label>
            <select id="catalog-sort" name="sort" class="bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-gray-200">
                <option value="relevance" selected>Relevancia</option>
                <option value="price_asc" >Precio: menor a mayor</option>
                <option value="price_desc" >Precio: mayor a menor</option>
                <option value="newest" >Más recientes</option>
            </select>
            <label class="sr-only" for="catalog-min">Precio mínimo</label>
            <input id="catalog-min" type="number" step="0.01" name="min" value="" placeholder="Precio mín."

            <button type="submit" class="bg-indigo-500 hover:bg-indigo-400 text-white px-6 py-2.5 rounded-xl font-bold transition-all">Filtrar</button>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2 font-bold pointer-events-none">
    <i class="ph-bold ph-check-circle text-xl"></i>
    ¡Añadido a tu lista!
</div>

<script>
    function showToast(btn) {
        const icon = btn.querySelector('i');
        const originalClass = icon.className;

        icon.className = "ph-bold ph-check";
        btn.classList.add('bg-green-500', 'border-green-600');
        btn.classList.remove('bg-indigo-500');

        const toast = document.getElementById('toast');
        toast.classList.remove('translate-y-20', 'opacity-0');

        setTimeout(() => {
            icon.className = originalClass;
            btn.classList.remove('bg-green-500', 'border-green-600');
            btn.classList.add('bg-indigo-500');
            toast.classList.add('translate-y-20', 'opacity-0');
        }, 2000);
    }
</script>
